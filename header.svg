<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Inchara Jayaram Anuradha – Software Engineer | Full Stack Developer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070b"/>
      <stop offset="1" stop-color="#14142a"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4aa8ff"/>
      <stop offset=".5" stop-color="#7c83ff"/>
      <stop offset="1" stop-color="#b07cff"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c83ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7c83ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b07cff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#b07cff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c1"><rect x="60" y="143" height="40" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0;0.1;0.28;0.32;1" values="0;540;540;0;0"/></rect></clipPath>
    <clipPath id="c2"><rect x="60" y="143" height="40" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0;0.333;0.433;0.613;0.653;1" values="0;0;350;350;0;0"/></rect></clipPath>
    <clipPath id="c3"><rect x="60" y="143" height="40" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0;0.667;0.767;0.947;0.987;1" values="0;0;430;430;0;0"/></rect></clipPath>
  </defs>

  <rect width="900" height="260" fill="url(#bg)"/>

  <!-- floating dots -->
  <g fill="#7c83ff" opacity=".5">
    <circle cx="780" cy="60" r="3"><animate attributeName="cy" values="60;40;60" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="110" r="2"><animate attributeName="cy" values="110;130;110" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="90" r="2"><animate attributeName="cy" values="90;70;90" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="45" r="2.5"><animate attributeName="cy" values="45;65;45" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- name -->
  <text x="60" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="url(#name)" opacity="0">
    Inchara Jayaram Anuradha
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>

  <!-- typed lines -->
  <g font-family="Courier New, ui-monospace, monospace" font-size="22" fill="#ececf4">
    <text x="60" y="170" clip-path="url(#c1)">Software Engineer | Full Stack Developer</text>
    <text x="60" y="170" clip-path="url(#c2)">Building reliable systems.</text>
    <text x="60" y="170" clip-path="url(#c3)">Crafting thoughtful experiences.</text>
  </g>

  <!-- cursor -->
  <rect y="147" width="2" height="30" fill="#4aa8ff" x="60">
    <animate attributeName="x" dur="12s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.1;0.28;0.32;0.333;0.433;0.613;0.653;0.667;0.767;0.947;0.987;1"
      values="60;600;600;60;60;410;410;60;60;490;490;60;60"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- waves -->
  <path fill="url(#w2)" d="M0 220 q112.5 -34 225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 V260 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="-450 0" to="0 0" dur="11s" repeatCount="indefinite"/>
  </path>
  <path fill="url(#w1)" d="M0 232 q112.5 -28 225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 V260 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="8s" repeatCount="indefinite"/>
  </path>
</svg>
